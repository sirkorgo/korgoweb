---
layout: default
title: "Blog"
colors: blog
---

<div class="container pulse">
  <div class="content">
    <span class="heading"><h1 style="text-align: left; margin: 0;">Blog</h1><a href="/blog/archive" style="width: 100%; display: flex; justify-content: flex-end;"><button class="generic-btn">View Archives</button></a></span>
    <section class="shelf">
      {% for post in site.posts limit:4 %}
          <div class="blogpost">
            <span class="post-header">
              <a class="postTitle" href="{{post.url}}">{{post.title}}</a>
              <p class="postDate">
                {{ post.date | date: "%b %-d, %Y" }}
              </p>
            </span>
            <hr>
            {{post.content}}
            <hr style="margin-bottom: 3px;">
          </div>
      {% endfor %}
    </section>
    <a href="/blog/archive" style="width: 100%; margin-top: 10px; display: flex; justify-content: center;"><button class="generic-btn" style="width: 100%; height: 40px; border-radius: 8px;">View Archives</button></a>
    </div>
  </div>
</div>
