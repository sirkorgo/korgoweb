---
sitemap: false
---

<!doctype html>
<html>
  <head>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
      html {
        background: none;
      }
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      p {
        margin-top: 0;
        margin-bottom: 0;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #toolbar {
        position: fixed;
        top: 10px;
        left: 15px;
        width: fit-content;
        min-width: 50px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 5px;
        padding-bottom: 5px;
        display: flex;
        gap: 17px;
        justify-content: center;
        text-align: center;
        font-family: "Roboto";
        font-size: 15px;
        font-weight: 500;
        background: rgba(255, 255, 255, 0.5);
        box-shadow: 0px 7px 10px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        z-index: 1000;
      }
      #stroke {
        border-radius: 5px;
        border: none;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.5);
        width: 32px;
      }
      .canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      .canvas.panning {
        cursor: grabbing;
      }
      .userCounter {
        display: flex;
        gap: 5px;
        justify-content: center;
        text-align: center;
        align-items: center;
      }
      #canvas {
        background: white;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <input id="stroke" name="stroke" type="color" />
    </div>
    <div class="canvas" id="canvasContainer">
      <canvas id="canvas"></canvas>
    </div>
    <script src="/src/js/canvas.js"></script>
    <script type="importmap">
      {
        "imports": {
          "partysocket": "https://unpkg.com/partysocket@latest"
        }
      }
    </script>
    <script src="https://korgosketch.sirkorgo.partykit.dev/client.js"></script>
  </body>
</html>
