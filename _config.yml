url: "https://www.sirkorgo.com"
permalink: pretty

collections:
  comics:
    output: true
    permalink: /comics/:path/
  art:
    output: true
    permalink: /art/:path/
  changelogs:
    output: false

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: "/blog/rss.xml"
  collections:
    comics:
      path: "/comics/rss.xml"
    art:
      path: "/art/rss.xml"

include:
  - draft/config.yml
