---
layout: default
title: "Guestbook"
colors: guestbook
desc: "Sign the guestbook!"
---

<div class="container pulse">
  <div class="content">
    <span class="heading"><h1 style="text-align: left; margin: 0;">Guestbook</h1></span>
    <div id="guestbook-wrapper">
      <iframe
        src="https://sirkorgo.atabook.org"
        width="100%"
        height="700px"
        style="border: none; border-radius: 15px"
      ></iframe>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async function() {
    try {
      const res = await fetch('/api/guestbook');
      const { blocked } = await res.json();
      if (blocked) {
        document.getElementById('guestbook-wrapper').innerHTML = `
          <p style="text-align:center;">⛔ You've been blocked from signing this guestbook.</p>
        `;
      }
    } catch (e) {
      console.log(e);
    }
  });
</script>
