<head>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu"
  />
</head>

<section class="nav-wrapper">
  <img
    src="/src/img/banner.png"
    width="100%"
    height="100%"
    style="margin-top: 15px; border-radius: 15px 15px 0px 0px; {% if page.layout contains 'content'  %}display: none;{% endif %}"
  />
  <nav id="nav">
    <div class="nav-left">
      <a href="/">
        <button
          class="index-nav navBtn {% if page.url == '/' %}active{% endif %}"
        >
          <img
            src="/src/img/sitelogo.webp"
            width="49px"
            height="40px"
            alt="Site Logo"
          />
        </button>
      </a>
      <button
        id="menu-toggle"
        class="menu-toggle"
        aria-label="Toggle navigation menu"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span id="links" class="nav-links">
        <a href="/about">
          <button
            class="navBtn about-nav {% if page.url contains '/about' %}active{% endif %}"
          >
            About
          </button>
        </a>
        <a href="/comics">
          <button
            class="navBtn comics-nav {% if page.url contains '/comics' %}active{% endif %}"
          >
            Webcomics
          </button>
        </a>
        <a href="/portfolio">
          <button
            class="navBtn canvas-nav {% if page.url contains '/portfolio' or page.url contains '/art' %}active{% endif %}"
          >
            Portfolio
          </button>
        </a>
        <a href="/blog">
          <button
            class="navBtn blog-nav {% if page.url contains '/blog' or page.layout contains 'post' %}active{% endif %}"
          >
            Blog
          </button>
        </a>
        <a href="/guestbook">
          <button
            class="navBtn guestbook-nav {% if page.url contains '/guestbook' %}active{% endif %}"
          >
            Guestbook
          </button>
        </a>
      </span>
    </div>

    <span class="nav-right-stats">
      <button id="btn" class="themeToggle" onclick="setTheme()">
        <img src="/src/img/light.svg" alt="Theme Toggle" />
      </button>
      <span class="stats-counter">
        <p style="margin: 0px 0px 0px 0px" id="online">🟡</p>
        <p style="margin: 0px 0px 0px 0px">•</p>
        <p style="margin: 0px 0px 0px 0px" id="visitors">#⋯</p>
      </span>
    </span>
  </nav>
</section>

<script src="/src/js/navbar.js"></script>
