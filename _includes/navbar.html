<head>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
  <link rel="stylesheet" href="/src/css/global.css" />
</head>
<div class="navContainer">
  <div>
    <div style="padding: 0px 10px 0px 10px" class="header">
      <a href="/">
        <img class="mobileHeader" src="/src/img/sitelogo.webp" alt="sirkorgo.com Site Logo" width="55" height="55" />
      </a>
    </div>
    <div class="header" style="
        position: absolute;
        gap: 10px;
        right: 10px;
        left: auto;
        align-items: center;
        justify-content: center;
      ">
      <script>
        const ws = new WebSocket(
          "wss://korgoviewer.sirkorgo.partykit.dev/parties/main/room",
        );

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "users") {
            document.getElementById("online").innerHTML = "🟢 " + data.count;
          }
        };
      </script>
      <span class="hideOnScroll thisThing">
        <!-- <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
        <script
          type='text/javascript'>kofiwidget2.init('Support me on Ko-fi', '#3076f0', 'T6T61WP8KV'); kofiwidget2.draw();</script> -->
      </span>
      <button id="btn" class="themeToggle" onclick="setTheme()">
        <img src="/src/img/light.svg" alt="Theme Toggle" />
      </button>
      <p style="margin: 0px 0px 0px 0px" id="online">🟡</p>
      <p style="margin: 0px 0px 0px 0px">•</p>
      <p style="margin: 0px 0px 0px 0px" id="visitors">#⋯</p>
    </div>

    <div style="padding: 3px 10px 3px 10px">
      <span class="index-nav {% if page.url == '/' %}active{% endif %}">
        <a href="/">
          <img class="navHeader" src="/src/img/sitelogo.webp" alt="Site Logo" width="55px" height="55px" />
        </a>
      </span>
    </div>
    <nav class="navbar" id="nav">
      <div style="display: flex; align-items: center; justify-content: center">
        <div class="menu-toggle" onclick="toggleMenu()">
          <span class="material-symbols-outlined"> menu </span>
        </div>
      </div>
      <div class="navItems hideOnScroll" id="navItems">
        <a href="/about">
          <button class="navBtn about-nav {% if page.url contains '/about' %}active{% endif %}">
            About
          </button>
        </a>
        <a href="/comics">
          <button class="navBtn comics-nav {% if page.url contains '/comics' %}active{% endif %}">
            Webcomics
          </button>
        </a>
        <a href="/art">
          <button class="navBtn canvas-nav {% if page.url contains '/art' %}active{% endif %}">
            Art
          </button>
        </a>
        <a href="/blog">
          <button
            class="navBtn blog-nav {% if page.url contains '/blog' or page.url contains '/202' %}active{% endif %}">
            Blog
          </button>
        </a>
        <a href="/guestbook">
          <button class="navBtn guestbook-nav {% if page.url contains '/guestbook' %}active{% endif %}">
            Guestbook
          </button>
        </a>
        <span style="margin-left: 10px;">
        </span>
      </div>
    </nav>
  </div>
  <script>
    const html = document.getElementById("html");
    const btn = document.getElementById("btn");

    function toggleMenu() {
      document.getElementById("navItems").classList.toggle("active");
      document.getElementById("nav").classList.toggle("active");
    }

    function setTheme() {
      html.classList.add("theme-transition");
      const isLight = html.classList.contains("light");
      const newTheme = isLight ? "dark" : "light";
      html.classList.remove("light", "dark");
      html.classList.add(newTheme);
      btn.innerHTML = `<img src="/src/img/${newTheme}.svg" alt="Theme Toggle">`;
      localStorage.setItem("theme", newTheme);
      setTimeout(() => html.classList.remove("theme-transition"), 200);
    }

    // Init theme
    html.classList.remove("light");
    html.classList.remove("dark");
    const saved = localStorage.getItem("theme");
    const theme =
      saved ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    html.classList.add(theme);
    btn.innerHTML = `<img src="/src/img/${theme}.svg" alt="Theme Toggle">`;

    // Scroll hide/show
    let lastScrollY = window.scrollY;
    let ticking = false;

    window.addEventListener("scroll", () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          // Selects every element with the .hideOnScroll class
          const targets = document.querySelectorAll(".hideOnScroll");
          const currentScrollY = window.scrollY;

          targets.forEach(el => {
            // Ensure transition is set for smooth movement
            el.style.transition = "all 0.3s ease";

            if (currentScrollY > 100 && currentScrollY > lastScrollY) {
              // Hiding
              el.style.opacity = "0";
              el.style.pointerEvents = "none";
              el.style.transform = "translateY(-20px)";
            } else {
              // Showing
              el.style.opacity = "1";
              el.style.pointerEvents = "auto";
              el.style.transform = "translateY(0)";
            }
          });

          lastScrollY = currentScrollY;
          ticking = false;
        });
        ticking = true;
      }
    });

  </script>
  <script>
    fetch('https://stats.sirkorgo.com/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        site: location.hostname,
        page: location.pathname,
        referrer: document.referrer
      })
    });

    fetch('https://stats.sirkorgo.com/count?site=' + location.hostname)
      .then(r => r.json())
      .then(d => document.getElementById('visitors').innerHTML = '# ' + d.count);
  </script>
</div>
