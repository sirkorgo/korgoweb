---
layout: gallery
title: "sirkorgo.com"
colors: canvas
---

<head>
  <link rel="stylesheet" href="/src/css/art.css" />
</head>

<div class="container pulse">
  <div class="content">
    <h1>Art Gallery</h1>
    <div class="grid">
      {% for piece in site.data.art %}
      <div class="thumb" onclick="openArt({{ piece.id }})">
        <img src="{{ piece.image }}" class="thumb" />
      </div>
      {% endfor %}
    </div>
  </div>
</div>
<script>
  const art = {{ site.data.art | jsonify }};

  function openArt(id) {
    const piece = art.find(p => p.id === id);
    document.getElementById('title').innerHTML = `${piece.title}`;
    document.getElementById('art-content').innerHTML = `<img src="${piece.image}">`;
    const overlay = document.getElementById('overlay');
    overlay.style.display = 'block';
    setTimeout(() => overlay.classList.add('active'), 10);
    history.pushState(null, '', '?id=' + id);
  }

  function closeArt() {
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('active');
    setTimeout(() => overlay.style.display = 'none', 300);
    history.pushState(null, '', location.pathname);
  }

  function nextArt() {
    const urlId = parseInt(new URLSearchParams(location.search).get('id'));
    const currentIndex = art.findIndex(p => p.id === urlId);
    const nextIndex = (currentIndex + 1) % art.length;
    openArt(art[nextIndex].id);
  }

  function prevArt() {
    const urlId = parseInt(new URLSearchParams(location.search).get('id'));
    const currentIndex = art.findIndex(p => p.id === urlId);
    const prevIndex = (currentIndex - 1 + art.length) % art.length;
    openArt(art[prevIndex].id);
  }

  // Load from URL on page load
  const urlId = new URLSearchParams(location.search).get('id');
  if (urlId) openArt(parseInt(urlId));
</script>
