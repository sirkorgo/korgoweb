<!DOCTYPE html>
<html id="html" class="{{page.colors}} light">

<head>
  <link rel="icon" type="image/x-icon" href="/src/img/favicon.ico" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/src/css/global.css" />
  <link rel="stylesheet" href="/src/css/post.css" />
  <title>{{ page.title - sirkorgo.com | default: "sirkorgo.com" }}</title>
  <meta property="og:title" content="A post about {{ page.title }} on sirkorgo.com" />
  <meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 150 }}" />
  <meta property="og:url" content="https://www.sirkorgo.com{{ page.url }}" />
  <meta property="og:image" content="https://www.sirkorgo.com/src/img/srkgo_meet.png" />
</head>

<body>
  {% include navbar.html %}
  <div class="pageContainer">
    <main class="page">
      <span class="comicHeader"><a href="/comics"><button class="generic-btn">← Go Back</button></a>
        <p><b>{{ page.series}} • Chapter {{page.chapter}}</b></p>

        {% assign current_series = page.series %}
        {% assign series_comics = site.comics | where: "series", current_series | sort: "chapter" %}

        <select onchange="location=this.value" class="dropdown">
          {% for comic in series_comics %}
          <option value="{{ comic.url }}" {% if comic.url==page.url %}selected{% endif %}>
            Chapter {{ comic.chapter }}
          </option>
          {% endfor %}
        </select>
      </span>
      <hr />
      <br />
      <span class="comicContent">
        {{ content }}
      </span>
    </main>
  </div>

  <script src="https://cursor-party.sirkorgo.partykit.dev/cursors.js"></script>
  {% include footer.html %}

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8562550888898510"
    crossorigin="anonymous"></script>
</body>

</html>
