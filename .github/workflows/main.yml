name: Sync to GitLab

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: wei/git-sync@v3
        with:
          source_repo: "${{ github.repository }}"
          source_branch: "main"
          destination_repo: "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/username/repo.git"
          destination_branch: "main"
