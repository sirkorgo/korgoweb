---
layout: default
title: "sirkorgo.com"
colors: blog
---

<div class="container pulse">
  <div class="content">
    <h2>Blog</h2>
    <br />
    <div class="shelf">
      {% for post in site.posts %}
      <div class="post">
        <a class="" href="{{ post.url }}">
          <div>
            <span>
              <p style="margin-bottom: 0px">
                {{ post.date | date: "%b %-d, %Y" }}
              </p>
              {{post.title}}
              <p style="margin-top: 5px">{{ post.excerpt }}</p>
            </span>
            {% assign first_image = post.content | split: '<img ' | slice: 1 |
            first | split: 'src="' | slice: 1 | first | split: '"' | first %} {%
            if first_image %}
            <img
              src="{{ first_image }}"
              alt="{{ post.title }}"
              style="width: 150px; height: 150px; object-fit: cover"
            />
            {% endif %}
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
